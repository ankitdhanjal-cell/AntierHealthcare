services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ahs
      POSTGRES_PASSWORD: ahs_local_pw
      POSTGRES_DB: ahs
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahs"]
      interval: 5s
      retries: 10
  redis:
    image: redis:latest
    ports: ["6389:6379"]
  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://ahs:ahs_local_pw@db:5432/ahs
      REDIS_URL: redis://redis:6379/0
    volumes: [evidence:/srv/data/evidence]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8010:8000"]
    command: sh -c "python -m app.seed --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://ahs:ahs_local_pw@db:5432/ahs
      REDIS_URL: redis://redis:6379/0
    depends_on: [api]
    command: celery -A app.celery_app worker --beat --loglevel=info
  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8010
    depends_on: [api]
    ports: ["3010:3000"]
volumes:
  pgdata:
  evidence:
